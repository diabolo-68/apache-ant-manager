name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Build
        run: |
          npm run compile
          npm run compile-tests

      - name: Unit tests
        run: npm run test:unit

      - name: Cache VS Code
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test --project=e2e

      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test --project=e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
